<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>부동산 상세 분석</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

  <!-- 헤더 -->
  <header>
    <h1>🏢 자치구 별 부동산 상세 분석</h1>
    <p>자치구 → 동 → 건물유형 → 평수 조건별 임대 계약 분석</p>
  </header>

  <!-- 필터 카드 -->
  <div class="card">
    <h3>🔍 조건 선택</h3>

    <div class="filter-row">
      <div class="filter-item">
        <label>자치구</label>
        <select id="districtSelect"></select>
      </div>

      <div class="filter-item">
        <label>동</label>
        <select id="dongSelect"></select>
      </div>

      <div class="filter-item">
        <label>건물 유형</label>
        <select id="buildingTypeSelect"></select>
      </div>

      <div class="filter-item">
        <label>평수 범위 (평)</label>
        <input type="number" id="minPyung" style="width:70px;"> ~
        <input type="number" id="maxPyung" style="width:70px;">
      </div>
    </div>
  </div>

  <!-- 평균 지표 카드 -->
  <div class="card">
    <h3>📈 평균 지표</h3>

    <div class="stats-row">
      <div class="stat-box">
        평균 월세<br>
        <strong><span id="avgRent">-</span></strong> 만원
      </div>
      <div class="stat-box">
        평균 보증금<br>
        <strong><span id="avgDeposit">-</span></strong> 만원
      </div>
      <div class="stat-box">
        계약 수<br>
        <strong><span id="totalCount">-</span></strong> 건
      </div>
    </div>
  </div>

  <!-- 계약 상세 카드 -->
  <div class="card">
    <h3>📄 계약 상세 데이터</h3>
    <button onclick="loadContracts()">계약 데이터 조회</button>

    <div class="table-container" style="margin-top:12px;">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>면적 (㎡)</th>
            <th>월세</th>
            <th>보증금</th>
            <th>계약일자</th>
          </tr>
        </thead>
        <tbody id="contractTableBody">
          <tr><td colspan="5">조회 버튼을 눌러주세요</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- JS 로직은 기존 코드 그대로 아래에 붙이면 됨 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const districtSelect = document.getElementById("districtSelect");
  const dongSelect = document.getElementById("dongSelect");
  const buildingTypeSelect = document.getElementById("buildingTypeSelect");

  const avgRentSpan = document.getElementById("avgRent");
  const avgDepositSpan = document.getElementById("avgDeposit");
  const totalCountSpan = document.getElementById("totalCount");
  const contractTableBody = document.getElementById("contractTableBody");

  function pyungToArea(pyung) {
    return pyung * 3.3058;
  }

  /* =====================
    평균 지표 로딩 (핵심)
  ===================== */
  function loadAvgStats() {
    const district = districtSelect.value;
    const dong = dongSelect.value;
    const buildingType = buildingTypeSelect.value;

    if (!district || !dong || !buildingType) return;

    const minPyung = document.getElementById("minPyung").value;
    const maxPyung = document.getElementById("maxPyung").value;

    let url = `/api/stats/avg?district=${encodeURIComponent(district)}`
            + `&dong=${encodeURIComponent(dong)}`
            + `&building_type=${encodeURIComponent(buildingType)}`;

    if (minPyung) url += `&min_area=${pyungToArea(Number(minPyung))}`;
    if (maxPyung) url += `&max_area=${pyungToArea(Number(maxPyung))}`;

    fetch(url)
      .then(res => res.json())
      .then(data => {
        avgRentSpan.textContent = data.avg_rent ?? "-";
        avgDepositSpan.textContent = data.avg_deposit ?? "-";
        totalCountSpan.textContent = data.total_count ?? "-";
      });
  }

  /* =====================
    초기 로딩
  ===================== */
  fetch("/api/districts")
    .then(res => res.json())
    .then(list => {
      districtSelect.innerHTML = "";
      list.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        districtSelect.appendChild(opt);
      });
      if (list.length) loadDongs(list[0]);
    });

  function loadDongs(district) {
    fetch(`/api/dongs?district=${encodeURIComponent(district)}`)
      .then(res => res.json())
      .then(list => {
        dongSelect.innerHTML = "";
        list.forEach(d => {
          const opt = document.createElement("option");
          opt.value = d;
          opt.textContent = d;
          dongSelect.appendChild(opt);
        });
      });
  }

  districtSelect.addEventListener("change", () => loadDongs(districtSelect.value));

  dongSelect.addEventListener("change", () => {
    fetch(`/api/stats/building-type?district=${districtSelect.value}&dong=${dongSelect.value}`)
      .then(res => res.json())
      .then(data => {
        buildingTypeSelect.innerHTML = "";
        data.labels.forEach(t => {
          const opt = document.createElement("option");
          opt.value = t;
          opt.textContent = t;
          buildingTypeSelect.appendChild(opt);
        });
      });
  });

  /* =====================
    🔥 이벤트 연결 핵심
  ===================== */
  buildingTypeSelect.addEventListener("change", loadAvgStats);
  document.getElementById("minPyung").addEventListener("change", loadAvgStats);
  document.getElementById("maxPyung").addEventListener("change", loadAvgStats);

  /* =====================
    계약 조회
  ===================== */
  function loadContracts() {
    loadAvgStats(); // ⭐ 평균과 항상 동기화

    const district = districtSelect.value;
    const dong = dongSelect.value;
    const buildingType = buildingTypeSelect.value;

    const minPyung = document.getElementById("minPyung").value;
    const maxPyung = document.getElementById("maxPyung").value;

    let url = `/api/contracts?district=${district}&dong=${dong}&building_type=${buildingType}`;
    if (minPyung) url += `&min_area=${pyungToArea(Number(minPyung))}`;
    if (maxPyung) url += `&max_area=${pyungToArea(Number(maxPyung))}`;

    contractTableBody.innerHTML = "<tr><td colspan='5'>불러오는 중...</td></tr>";

    fetch(url)
      .then(res => res.json())
      .then(rows => {
        contractTableBody.innerHTML = "";
        if (!rows.length) {
          contractTableBody.innerHTML = "<tr><td colspan='5'>데이터 없음</td></tr>";
          return;
        }
        rows.forEach((r, i) => {
          contractTableBody.innerHTML += `
            <tr>
              <td>${i + 1}</td>
              <td>${r.area}</td>
              <td>${r.rent}</td>
              <td>${r.deposit}</td>
              <td>${r.contract_date}</td>
            </tr>`;
        });
      });
  }

</script>

</body>
</html>
