<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Drill-down 분석</title>
</head>
<body>

<h2>서울시 부동산 Drill-down 분석</h2>

<!-- ===================== -->
<!-- 선택 영역 -->
<!-- ===================== -->

<div style="margin-bottom: 12px;">
  <label>자치구: </label>
  <select id="districtSelect"></select>
</div>

<div style="margin-bottom: 12px;">
  <label>동: </label>
  <select id="dongSelect">
    <option>자치구를 먼저 선택하세요</option>
  </select>
</div>

<div style="margin-bottom: 12px;">
  <label>건물 유형: </label>
  <select id="buildingTypeSelect">
    <option>동을 선택하세요</option>
  </select>
</div>

<!-- ===================== -->
<!-- 평균 지표 -->
<!-- ===================== -->

<div style="margin-top: 16px;">
  <h3>선택한 동 · 건물 유형의 평균 지표</h3>
  <p>평균 월세: <span id="avgRent">-</span> 만원</p>
  <p>평균 보증금: <span id="avgDeposit">-</span> 만원</p>
  <p>총 계약 수 : <span id="totalCount">-</span> 건</p>
</div>


<!-- ===================== -->
<!-- 계약 조회 -->
<!-- ===================== -->

<div style="margin-top: 24px;">
  <button onclick="loadContracts()">📄 계약 데이터 조회</button>
</div>

<div style="margin-top: 16px;">
  <h3>계약 상세 데이터</h3>

  <table border="1" cellpadding="6" cellspacing="0">
    <thead>
      <tr>
        <th>No</th>
        <th>면적 (㎡)</th>
        <th>월세 (만원)</th>
        <th>보증금 (만원)</th>
        <th>계약일</th>
      </tr>
    </thead>
    <tbody id="contractTableBody">
      <tr>
        <td colspan="5">조회 버튼을 눌러주세요</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- ===================== -->
<!-- 건물 유형 비율 -->
<!-- ===================== -->

<div style="margin-top: 24px;">
  <h3>건물 유형별 비율</h3>
  <button onclick="loadBuildingType()">건물 유형 보기</button>
  <br><br>
  <canvas id="buildingTypeChart" width="400" height="300"></canvas>
</div>

<!-- ===================== -->
<!-- Chart.js -->
<!-- ===================== -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- ===================== -->
<!-- 모든 JS 로직 -->
<!-- ===================== -->
<script>
  const districtSelect = document.getElementById("districtSelect");
  const dongSelect = document.getElementById("dongSelect");
  const buildingTypeSelect = document.getElementById("buildingTypeSelect");

  const avgRentSpan = document.getElementById("avgRent");
  const avgDepositSpan = document.getElementById("avgDeposit");
  const contractTableBody = document.getElementById("contractTableBody");
  const totalCountSpan = document.getElementById("totalCount");

  let buildingChart = null;

  /* =====================
     초기 로딩: 자치구
  ===================== */
  fetch("/api/districts")
    .then(res => res.json())
    .then(districts => {
      districtSelect.innerHTML = "";
      districts.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        districtSelect.appendChild(opt);
      });

      if (districts.length > 0) {
        loadDongs(districts[0]);
      }
    });

  /* =====================
     자치구 → 동
  ===================== */
  districtSelect.addEventListener("change", () => {
    loadDongs(districtSelect.value);
  });

  function loadDongs(district) {
    dongSelect.innerHTML = "<option>불러오는 중...</option>";
    buildingTypeSelect.innerHTML = "<option>동을 선택하세요</option>";

    fetch(`/api/dongs?district=${encodeURIComponent(district)}`)
      .then(res => res.json())
      .then(dongs => {
        dongSelect.innerHTML = "";
        dongs.forEach(d => {
          const opt = document.createElement("option");
          opt.value = d;
          opt.textContent = d;
          dongSelect.appendChild(opt);
        });
      });
  }

  /* =====================
     동 → 건물 유형 목록
  ===================== */
  dongSelect.addEventListener("change", () => {
    const district = districtSelect.value;
    const dong = dongSelect.value;

    fetch(`/api/stats/building-type?district=${encodeURIComponent(district)}&dong=${encodeURIComponent(dong)}`)
      .then(res => res.json())
      .then(data => {
        buildingTypeSelect.innerHTML = "";
        data.labels.forEach(t => {
          const opt = document.createElement("option");
          opt.value = t;
          opt.textContent = t;
          buildingTypeSelect.appendChild(opt);
        });
      });
  });

  /* =====================
     건물 유형 선택 → 평균 지표
  ===================== */
  buildingTypeSelect.addEventListener("change", () => {
    const district = districtSelect.value;
    const dong = dongSelect.value;
    const buildingType = buildingTypeSelect.value;

    fetch(`/api/stats/avg?district=${encodeURIComponent(district)}&dong=${encodeURIComponent(dong)}&building_type=${encodeURIComponent(buildingType)}`)
      .then(res => res.json())
      .then(data => {
        avgRentSpan.textContent = data.avg_rent ?? "-";
        avgDepositSpan.textContent = data.avg_deposit ?? "-";
        totalCountSpan.textContent = data.total_count ?? "-";
      });
  });

  /* =====================
     계약 데이터 조회
  ===================== */
  function loadContracts() {
    const district = districtSelect.value;
    const dong = dongSelect.value;
    const buildingType = buildingTypeSelect.value;

    contractTableBody.innerHTML = "<tr><td colspan='5'>불러오는 중...</td></tr>";

    fetch(`/api/contracts?district=${encodeURIComponent(district)}&dong=${encodeURIComponent(dong)}&building_type=${encodeURIComponent(buildingType)}`)
      .then(res => res.json())
      .then(rows => {
        contractTableBody.innerHTML = "";

        if (rows.length === 0) {
          contractTableBody.innerHTML = "<tr><td colspan='5'>데이터 없음</td></tr>";
          return;
        }

        rows.forEach((r, i) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${i + 1}</td>
            <td>${r.area ?? "-"}</td>
            <td>${r.rent ?? "-"}</td>
            <td>${r.deposit ?? "-"}</td>
            <td>${r.contract_date ?? "-"}</td>
          `;
          contractTableBody.appendChild(tr);
        });
      });
  }

  /* =====================
     건물 유형 파이차트
  ===================== */
  function loadBuildingType() {
    const district = districtSelect.value;
    const dong = dongSelect.value;

    fetch(`/api/stats/building-type?district=${encodeURIComponent(district)}&dong=${encodeURIComponent(dong)}`)
      .then(res => res.json())
      .then(data => drawBuildingTypeChart(data.labels, data.values));
  }

  function drawBuildingTypeChart(labels, values) {
    const ctx = document.getElementById("buildingTypeChart").getContext("2d");

    if (buildingChart) buildingChart.destroy();

    buildingChart = new Chart(ctx, {
      type: "pie",
      data: {
        labels: labels,
        datasets: [{ data: values }]
      }
    });
  }
</script>

</body>
</html>
