<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>부동산 인사이트</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">

  <!-- 헤더 -->
  <header>
    <h1>서울시 부동산 데이터 분석 서비스</h1>
    <p>자치구·동·건물유형별 임대 정보를 데이터베이스 기반으로 분석합니다.</p>
    <P>위 데이터는 공공 데이터 포털로부터 가져왔습니다.</P>
  </header>

  <!-- Drill-down 이동 -->
  <div class="card">
    <a href="/drilldown">
      <button> 상세 분석 보러가기</button>
    </a>
  </div>

  <!-- 차트 카드 -->
  <div class="card">
    <h2>📊 자치구별 평균 월세</h2>
    <button onclick="loadAvgRent()">그래프 보기</button>

    <div style="margin-top:16px;">
      <canvas id="avgRentChart" height="120"></canvas>
    </div>
  </div>

</div>

<script>
let chart = null;

function loadAvgRent() {
  fetch("/api/avg-rent")
    .then(res => res.json())
    .then(data => drawChart(data.labels, data.values));
}

function drawChart(labels, values) {
  const ctx = document.getElementById("avgRentChart").getContext("2d");
  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        label: "평균 월세 (만원)",
        data: values
      }]
    }
  });
}
</script>

</body>
</html>
